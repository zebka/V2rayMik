name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SING_BOX_VERSION: "1.14.4"
  XRAY_VERSION: "26.11.9"
  # Lowercase on purpose: the repository is V2rayMik, and the registry rejects
  # capitals in a path. A fork must change this line to its own namespace.
  IMAGE: ghcr.io/zebka/v2raymik

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # VERSION is the release tag: one number for the repo, the image and the
      # changelog, so a running container can never be a version the repository
      # does not describe.
      - name: Version and tag agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(cat VERSION)"
          got="${GITHUB_REF_NAME#v}"
          if [ "$want" != "$got" ]; then
            echo "VERSION is $want but the tag is $got" >&2
            exit 1
          fi

      - name: CHANGELOG describes this version
        run: |
          v="$(cat VERSION)"
          grep -q "^## $v " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $v' section" >&2; exit 1; }

      - name: Build the test image
        run: |
          docker buildx build --build-arg SING_BOX_VERSION="$SING_BOX_VERSION" \
            --build-arg XRAY_VERSION="$XRAY_VERSION" \
            --build-arg VERSION="$(cat VERSION)" \
            -t v2raymik:test docker --load

      - name: Unit tests
        run: |
          docker run --rm -v "$PWD/tests:/w/tests:ro" \
            --entrypoint sh v2raymik:test /w/tests/run.sh

      - name: Image carries the repository version
        run: |
          got="$(docker run --rm --entrypoint cat v2raymik:test /app/VERSION)"
          test "$got" = "$(cat VERSION)" || {
            echo "image says $got, VERSION says $(cat VERSION)" >&2; exit 1; }

      - name: Both engines are in the image and run
        run: |
          docker run --rm --entrypoint sing-box v2raymik:test version >/dev/null
          docker run --rm --entrypoint xray v2raymik:test version >/dev/null

      - name: RouterOS lint
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint sh v2raymik:test /w/tests/lint-rsc.sh router

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Secrets cannot be used directly in `if:`; map them to env first.
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: it exists so the image can be pulled through an
      # Iranian Docker Hub mirror when ghcr.io is unreachable.
      - name: Docker Hub login
        if: env.DH_USER != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - id: ver
        name: Read VERSION
        run: |
          v="$(cat VERSION)"
          if [ "${{ github.ref_type }}" != "tag" ]; then v="$v-edge"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DH_USER != '' && format('docker.io/{0}/v2raymik', env.DH_USER) || '' }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ env.SING_BOX_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=xray-${{ env.XRAY_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
            VERSION=${{ steps.ver.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub page in step with the repository: the long
      # description lives in docs/dockerhub.md and is published from here.
      - name: Docker Hub overview
        if: env.DH_USER != ''
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}
          repository: ${{ env.DH_USER }}/v2raymik
          short-description: "V2rayMik - MikroTik RouterOS to sing-box/Xray gateway, one container"
          readme-filepath: ./docs/dockerhub.md

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - id: ver
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Matches source tag `v${{ steps.ver.outputs.value }}` (the `VERSION` file
            in the repository).

            Images: `azebka/v2raymik:${{ steps.ver.outputs.value }}`
            and `:latest` (Docker Hub),
            `ghcr.io/zebka/v2raymik:${{ steps.ver.outputs.value }}` (GHCR).

            Details for this release are in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
