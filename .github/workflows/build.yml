name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  XRAY_VERSION: "26.10.31"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: |
          docker buildx build --build-arg XRAY_VERSION="$XRAY_VERSION" \
            -t mikrotik-xray-gateway:test docker --load

      - name: Unit tests
        run: |
          docker run --rm -v "$PWD/tests:/w/tests:ro" \
            --entrypoint sh mikrotik-xray-gateway:test /w/tests/run.sh

      - name: RouterOS lint
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint sh mikrotik-xray-gateway:test /w/tests/lint-rsc.sh router

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Secrets cannot be used directly in `if:`; map them to env first.
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: it exists so the image can be pulled through an
      # Iranian Docker Hub mirror when ghcr.io is unreachable.
      - name: Docker Hub login
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DH_USER != '' && format('docker.io/{0}/mikrotik-xray-gateway', env.DH_USER) || '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ env.XRAY_VERSION }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            XRAY_VERSION=${{ env.XRAY_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub page in step with the repository: the long
      # description lives in docs/dockerhub.md and is published from here.
      - name: Docker Hub overview
        if: env.DH_USER != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}
          repository: ${{ env.DH_USER }}/mikrotik-xray-gateway
          short-description: "MikroTik RouterOS -> Xray egress gateway: one Alpine container, native TUN, LAN admin page"
          readme-filepath: ./docs/dockerhub.md

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `azebka/mikrotik-xray-gateway:${{ github.ref_name }}` (Docker Hub)
            and `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` (GHCR).

            Details for this release are in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

